id: dinkgreve2015_fig2
title: Rigid-emulsion flow curves near jamming (Dinkgreve et al. 2015, Fig. 2)
description: Steady-state flow curves of castor-oil-in-water emulsions with rigid
  droplet interfaces (0.4 wt% BSA + 0.4 wt% PGA), digitized from Fig. 2(a) of Dinkgreve,
  Paredes, Michels & Bonn, Phys. Rev. E 92, 012305 (2015). Seven internal volume fractions
  from 0.65 to 0.80, spanning the jamming concentration. All supercritical curves
  are well described by the Herschel-Bulkley equation; the paper uses this dataset
  to demonstrate universal rescaling of flow curves with distance to jamming.
