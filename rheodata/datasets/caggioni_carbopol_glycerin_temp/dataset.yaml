id: caggioni_carbopol_glycerin_temp
title: Carbopol in glycerin, temperature series (community)
description: 'Equilibrium flow curves of Carbopol in glycerin: 51 points each from
  0.001 to 100 s^-1 at 20, 30 and 40 C. The temperature series lets the background
  viscosity be extracted from TC-model fits and tested against the solvent''s Arrhenius
  law: the fitted background viscosity follows Arrhenius behavior with an activation
  energy close to literature glycerol. A fourth sweep at 50 C was dropped from the
  curated set. Originally measured for the rheofit Carbopol-in-glycerin walkthrough.'
