id: seth2011_S4b
title: Soft particle glass flow curves, supplementary set B (Seth et al. 2011, Fig.
  S4b)
description: Steady-state flow curves of jammed soft-particle glasses digitized from
  supplementary Fig. S4b of Seth et al., Nature Mater. 10, 838-843 (2011). Three volume
  fractions (0.72, 0.75, 0.86). Companion to the S4a set, covering a second batch
  of the same soft-particle system; the paper's micromechanical model is compared
  against both sets. One small digitization glitch in the 0.72 curve (single out-of-order
  point) was fixed by sorting.
