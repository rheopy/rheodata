  protocol: Measured on an Anton-Paar MCR 501 with cone-and-Peltier-plate (50 mm,
    2 deg, 48 um truncation) and solvent trap at 20 C; roughened shearing surfaces
    (waterproof sandpaper, 20 um) to suppress wall slip.
