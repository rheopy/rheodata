id: caggioni_pg_carbopol_2pct
title: Carbopol Ultrez 21 in propylene glycol, flow curve (community)
description: 'A single equilibrium flow sweep of 2% Carbopol Ultrez 21 dispersed in
  propylene glycol: 61 points from 10^-3 to 10^3 s^-1 at 20 C, measured with a concentric-cylinder
  geometry. Carbopol is a jammed microgel (a soft-particle glass) and propylene glycol
  is a viscous continuous phase; this combination is the textbook case where a three-component
  (TC) model separates the particle and viscous contributions better than Herschel-Bulkley.
  Originally measured for the rheofit fit-app walkthrough.'
