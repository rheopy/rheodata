id: pamvouxoglou2021_fig6
title: Concentrated colloidal suspension flow curves (Pamvouxoglou et al. 2021, Fig.
  6)
description: Steady-state flow curves of concentrated hard-sphere colloidal suspensions
  digitized from Fig. 6 of Pamvouxoglou, Schofield, Petekidis & Egelhaaf, J. Rheol.
  65, 1219-1233 (2021). Three volume fractions (0.575, 0.602, 0.624) near the colloidal
  glass transition. The paper compares stress- versus strain-controlled shear and
  the yielding/relaxation behavior of the same suspensions; the digitized curves are
  the steady-state flow curves.
