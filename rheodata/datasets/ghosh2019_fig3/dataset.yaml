id: ghosh2019_fig3
title: pNIPAM microgel flow curves from glassy to jammed regimes (Ghosh et al. 2019,
  Fig. 3)
description: Steady-state flow curves of self-crosslinked, slightly charged, repulsive
  pNIPAM microgel suspensions digitized from Fig. 3 of Ghosh et al., Soft Matter 15,
  1038-1052 (2019). Seven volume fractions from 0.46 to 0.881, spanning the fluid,
  glassy, and putatively jammed regimes. The paper combines experiment with a microscopic
  force-based theory of nonlinear yielding across all three regimes.
