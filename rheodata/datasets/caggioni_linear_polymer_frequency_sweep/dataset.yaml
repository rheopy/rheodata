id: caggioni_linear_polymer_frequency_sweep
title: High-MW linear polymer in water, frequency sweep (community)
description: 'Small-amplitude frequency sweep of a high-molecular-weight linear polymer in aqueous solution: 31 points, angular frequency 100 down to 0.1 rad/s at strain amplitude 0.5 %, 25 C (inside the linear viscoelastic regime located by the companion amplitude sweep). The complex viscosity feeds the Cox-Merz superposition against the steady-shear flow curve. Parent TRIOS file a_remake_dhr2.json (step ''Frequency sweep - 3''). Originally measured for the rheofit Carreau walkthrough.'
