id: paredes2013_fig1
title: Emulsion flow curves across the zero-temperature jamming transition (Paredes,
  Michels & Bonn 2013, Fig. 1)
description: 'Steady-state flow curves of a dense soft-sphere emulsion digitized from
  Fig. 1 of Paredes, Michels & Bonn, Phys. Rev. Lett. 111, 015701 (2013). Ten volume
  fractions from 0.65 to 0.80 spanning the jamming transition. This is the foundational
  dataset for the jamming-as-critical-transition scaling picture: supercritical curves
  follow Herschel-Bulkley and collapse onto a master curve when rescaled by distance
  to jamming.'
