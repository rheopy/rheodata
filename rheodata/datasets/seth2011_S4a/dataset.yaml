id: seth2011_S4a
title: Soft particle glass flow curves, supplementary set A (Seth et al. 2011, Fig.
  S4a)
description: Steady-state flow curves of jammed soft-particle glasses digitized from
  supplementary Fig. S4a of Seth et al., Nature Mater. 10, 838-843 (2011). Six volume
  fractions from 0.70 to 0.92. The paper introduces a micromechanical model predicting
  the flow of soft particle glasses from particle-scale contact mechanics; the supplementary
  flow curves support the model over a wide range of packing fractions. One duplicated
  trailing artifact point in the 0.92 curve was dropped during curation.
