id: caggioni_wlm_polymer_temp_series
title: Wormlike-micelle + polymer surfactant system, temperature series (community)
description: 'Equilibrium flow curves of a mixed surfactant system - wormlike micelles
  (WLM) plus a polymer solution: 41 points each from 0.01 to 100 s^-1 at 18, 20, 22,
  24, 26 and 28 C, plus a repeat at 18 C. The curves carry at least two distinct relaxation
  times (a fast WLM mode and a slow polymer mode); a single Carreau model cannot bend
  twice, making this the benchmark dataset for two-mode (carreau-carreau) fits. Parameters
  evolve smoothly with temperature and the WLM mode fades at 26-28 C. Originally measured
  for the rheofit carreau-carreau walkthrough.'
