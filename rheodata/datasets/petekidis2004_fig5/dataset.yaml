id: petekidis2004_fig5
title: PMMA colloidal glass flow curves (Petekidis, Vlassopoulos & Pusey 2004, Fig.
  5)
description: 'Steady-state flow curves of hard-sphere PMMA colloidal glasses digitized
  from Fig. 5 of Petekidis, Vlassopoulos & Pusey, J. Phys.: Condens. Matter 16, S3955-S3963
  (2004). Five volume fractions from 0.586 to 0.63. The original figure has normalized
  axes, so the recorded scale factors were applied: shear rate x 0.158 s^-1, stress
  x 0.0825 Pa, giving yield stresses of order 1-100 Pa, consistent with hard-sphere
  colloidal glasses at these volume fractions. One out-of-order digitization point
  in the 0.596 curve was fixed by sorting.'
