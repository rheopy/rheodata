id: caggioni_linear_polymer_amplitude_sweep
title: High-MW linear polymer in water, amplitude sweep (community)
description: 'Strain-amplitude sweep of a high-molecular-weight linear polymer in aqueous solution: 41 points from 1000 down to 0.1 % at fixed angular frequency 1 rad/s, 25 C. G-prime and G-double-prime are strain-independent up to a strain amplitude of about 10-25 %, locating the linear viscoelastic regime; the sweep also feeds the Delaware-Rutgers rule. Parent TRIOS file a_remake_dhr2.json (step ''Amplitude sweep - 1''). Originally measured for the rheofit Carreau walkthrough.'
