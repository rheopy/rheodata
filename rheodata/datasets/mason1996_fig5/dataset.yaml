id: mason1996_fig5
title: Monodisperse emulsion flow curves vs volume fraction (Mason, Bibette & Weitz
  1996, Fig. 5)
description: Steady-state flow curves of fractionated monodisperse oil-in-water emulsions
  digitized from Fig. 5 of Mason, Bibette & Weitz, J. Colloid Interface Sci. 179,
  439-448 (1996). Six volume fractions from 0.55 to 0.65 across the disordered close-packing
  transition. The original stress values were recorded in dynes/cm2 and have been
  converted to Pa (x 0.1); this is the classic dataset showing the sharp onset of
  a yield stress above random close packing.
